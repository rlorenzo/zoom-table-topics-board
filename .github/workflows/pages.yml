name: Deploy to GitHub Pages

# Publishes the static browser app to GitHub Pages. In the hosted build the app
# runs in manual mode (no Zoom auto-read), so the only files the live page loads
# are the front-end statics below plus Google Fonts from their CDN.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token plus the OIDC id-token the deploy step needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel an in-flight publish; let it finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      # Copy only the files the live page loads into a clean _site/. Everything
      # else (board.py, tests/, *.md, dotfiles, node tooling) stays out so the
      # site is served verbatim. .nojekyll keeps Pages from touching the files.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css app.js lib.js engine.js _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
